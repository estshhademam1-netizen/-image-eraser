<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111318"
    >

    <title>AI Image Eraser</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #f4f5f8,
                    #e9ebf0
                );

            color: #15161a;

            min-height: 100vh;
        }

        .app {

            width: 100%;
            max-width: 720px;

            margin: auto;

            padding:
                20px
                16px
                40px;
        }

        .header {

            text-align: center;

            margin-bottom: 22px;
        }

        .logo {

            width: 58px;
            height: 58px;

            margin: auto;

            border-radius: 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 28px;

            background: #111318;

            color: white;

            box-shadow:
                0 10px 25px
                rgba(0,0,0,.15);
        }

        h1 {

            margin:
                12px
                0
                5px;

            font-size: 27px;
        }

        .subtitle {

            color: #777b84;

            font-size: 14px;
        }

        .card {

            background: white;

            border-radius: 26px;

            padding: 16px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.08);
        }

        .upload {

            border:
                2px dashed
                #d5d7dc;

            border-radius: 20px;

            min-height: 150px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 25px;

            cursor: pointer;
        }

        .upload-icon {

            font-size: 42px;

            margin-bottom: 8px;
        }

        .upload-title {

            font-weight: 700;

            font-size: 17px;
        }

        .upload-text {

            color: #8a8e96;

            font-size: 13px;

            margin-top: 5px;
        }

        input[type="file"] {

            display: none;
        }

        .editor {

            display: none;

            margin-top: 15px;
        }

        .canvas-wrap {

            position: relative;

            width: 100%;

            border-radius: 22px;

            overflow: hidden;

            background: #eee;

            touch-action: none;
        }

        #imageCanvas {

            display: block;

            width: 100%;

            height: auto;
        }

        #paintCanvas {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            touch-action: none;
        }

        .instruction {

            text-align: center;

            color: #777b84;

            font-size: 14px;

            padding: 13px 0;
        }

        .settings {

            background: #f5f6f8;

            border-radius: 20px;

            padding: 16px;

            margin-top: 5px;
        }

        .setting-title {

            font-weight: 700;

            margin-bottom: 12px;

            font-size: 15px;
        }

        .methods {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }

        .method {

            border:
                2px solid
                #e1e2e6;

            background: white;

            border-radius: 16px;

            padding: 14px 10px;

            cursor: pointer;

            text-align: center;

            transition: .2s;
        }

        .method.active {

            border-color: #111318;

            background: #111318;

            color: white;
        }

        .method-icon {

            font-size: 24px;

            margin-bottom: 5px;
        }

        .method-name {

            font-weight: 700;

            font-size: 14px;
        }

        .method-description {

            font-size: 11px;

            opacity: .65;

            margin-top: 4px;

            line-height: 1.3;
        }

        .brush-box {

            margin-top: 14px;
        }

        .brush-row {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 8px;

            color: #555963;
        }

        .brush-value {

            font-weight: 700;
        }

        input[type="range"] {

            width: 100%;
        }

        .buttons {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 14px;
        }

        button {

            border: 0;

            border-radius: 17px;

            padding: 15px;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }

        .secondary {

            background: #eef0f3;

            color: #25272c;
        }

        .danger {

            background: #fff0f0;

            color: #d73434;
        }

        .remove {

            width: 100%;

            margin-top: 12px;

            background: #111318;

            color: white;

            font-size: 17px;

            padding: 18px;
        }

        .remove:disabled {

            opacity: .55;

            cursor: not-allowed;
        }

        .loading {

            display: none;

            margin-top: 15px;

            padding: 18px;

            border-radius: 17px;

            background: #f2f3f6;

            text-align: center;

            color: #555963;

            font-size: 14px;
        }

        .spinner {

            width: 25px;

            height: 25px;

            border:
                3px solid
                #ddd;

            border-top-color:
                #111318;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;

            margin:
                0
                auto
                10px;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        .error {

            display: none;

            margin-top: 15px;

            padding: 15px;

            border-radius: 16px;

            background: #fff0f0;

            color: #c93131;

            text-align: center;

            font-size: 14px;
        }

        .result {

            display: none;

            margin-top: 18px;
        }

        .result-title {

            font-weight: 800;

            margin-bottom: 10px;

            text-align: center;
        }

        #resultImage {

            width: 100%;

            display: block;

            border-radius: 20px;
        }

        .download {

            width: 100%;

            margin-top: 12px;

            background: #111318;

            color: white;
        }

        .footer {

            text-align: center;

            color: #999da5;

            font-size: 12px;

            margin-top: 25px;
        }

        @media (
            max-width: 420px
        ) {

            .app {
                padding:
                    14px
                    10px
                    30px;
            }

            .card {
                padding: 12px;
                border-radius: 22px;
            }

        }

    </style>

</head>


<body>

<div class="app">

    <div class="header">

        <div class="logo">
            ✨
        </div>

        <h1>
            AI Image Eraser
        </h1>

        <div class="subtitle">
            Remove unwanted objects from your photos
        </div>

    </div>


    <div class="card">


        <!-- ========================================= -->
        <!-- UPLOAD -->
        <!-- ========================================= -->

        <label
            class="upload"
            id="uploadBox"
        >

            <div class="upload-icon">
                📷
            </div>

            <div class="upload-title">
                Choose an image
            </div>

            <div class="upload-text">
                JPG, PNG or WEBP
            </div>

            <input
                type="file"
                id="fileInput"
                accept="image/*"
            >

        </label>


        <!-- ========================================= -->
        <!-- EDITOR -->
        <!-- ========================================= -->

        <div
            class="editor"
            id="editor"
        >

            <div class="canvas-wrap">

                <canvas
                    id="imageCanvas"
                ></canvas>

                <canvas
                    id="paintCanvas"
                ></canvas>

            </div>


            <div class="instruction">

                👆 Paint over the object you want to remove

            </div>


            <!-- ===================================== -->
            <!-- SETTINGS -->
            <!-- ===================================== -->

            <div class="settings">

                <div class="setting-title">
                    Removal Method
                </div>


                <div class="methods">


                    <div
                        class="method active"
                        id="aiMethod"
                        data-method="ai"
                    >

                        <div class="method-icon">
                            🤖
                        </div>

                        <div class="method-name">
                            AI Removal
                        </div>

                        <div class="method-description">
                            Better for complex backgrounds
                        </div>

                    </div>


                    <div
                        class="method"
                        id="classicMethod"
                        data-method="classic"
                    >

                        <div class="method-icon">
                            ⚡
                        </div>

                        <div class="method-name">
                            Classic
                        </div>

                        <div class="method-description">
                            Faster for simple objects
                        </div>

                    </div>


                </div>


                <!-- BRUSH -->

                <div class="brush-box">

                    <div class="brush-row">

                        <span>
                            Brush Size
                        </span>

                        <span
                            class="brush-value"
                            id="brushValue"
                        >
                            40 px
                        </span>

                    </div>

                    <input
                        type="range"
                        id="brushSize"
                        min="10"
                        max="120"
                        value="40"
                    >

                </div>

            </div>


            <!-- ===================================== -->
            <!-- BUTTONS -->
            <!-- ===================================== -->

            <div class="buttons">

                <button
                    class="secondary"
                    id="undoButton"
                >
                    ↩️ Undo
                </button>

                <button
                    class="danger"
                    id="clearButton"
                >
                    Clear
                </button>

            </div>


            <button
                class="remove"
                id="removeButton"
            >
                ✨ Remove Object
            </button>


            <!-- ===================================== -->
            <!-- LOADING -->
            <!-- ===================================== -->

            <div
                class="loading"
                id="loading"
            >

                <div class="spinner"></div>

                <div id="loadingText">
                    Processing image...
                </div>

            </div>


            <!-- ===================================== -->
            <!-- ERROR -->
            <!-- ===================================== -->

            <div
                class="error"
                id="errorBox"
            ></div>


            <!-- ===================================== -->
            <!-- RESULT -->
            <!-- ===================================== -->

            <div
                class="result"
                id="resultBox"
            >

                <div class="result-title">
                    ✨ Result
                </div>

                <img
                    id="resultImage"
                    alt="Result"
                >

                <button
                    class="download"
                    id="downloadButton"
                >
                    ⬇️ Download Result
                </button>

            </div>

        </div>

    </div>


    <div class="footer">

        Image Eraser · Flask + OpenCV + AI

    </div>

</div>


<script>

    // =====================================================
    // ELEMENTS
    // =====================================================

    const fileInput =
        document.getElementById(
            "fileInput"
        );

    const uploadBox =
        document.getElementById(
            "uploadBox"
        );

    const editor =
        document.getElementById(
            "editor"
        );

    const imageCanvas =
        document.getElementById(
            "imageCanvas"
        );

    const paintCanvas =
        document.getElementById(
            "paintCanvas"
        );

    const imageCtx =
        imageCanvas.getContext(
            "2d"
        );

    const paintCtx =
        paintCanvas.getContext(
            "2d"
        );

    const brushSize =
        document.getElementById(
            "brushSize"
        );

    const brushValue =
        document.getElementById(
            "brushValue"
        );

    const undoButton =
        document.getElementById(
            "undoButton"
        );

    const clearButton =
        document.getElementById(
            "clearButton"
        );

    const removeButton =
        document.getElementById(
            "removeButton"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const loadingText =
        document.getElementById(
            "loadingText"
        );

    const errorBox =
        document.getElementById(
            "errorBox"
        );

    const resultBox =
        document.getElementById(
            "resultBox"
        );

    const resultImage =
        document.getElementById(
            "resultImage"
        );

    const downloadButton =
        document.getElementById(
            "downloadButton"
        );


    // =====================================================
    // VARIABLES
    // =====================================================

    let originalFile = null;

    let imageObject = null;

    let drawing = false;

    let selectedMethod = "ai";

    let history = [];


    // =====================================================
    // FILE UPLOAD
    // =====================================================

    fileInput.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file) {
                return;
            }

            originalFile = file;

            const reader =
                new FileReader();

            reader.onload =
                function (event) {

                    imageObject =
                        new Image();

                    imageObject.onload =
                        function () {

                            setupCanvas();

                            editor.style.display =
                                "block";

                            resultBox.style.display =
                                "none";

                            errorBox.style.display =
                                "none";

                        };

                    imageObject.src =
                        event.target.result;

                };

            reader.readAsDataURL(
                file
            );

        }
    );


    // =====================================================
    // SETUP CANVAS
    // =====================================================

    function setupCanvas() {

        imageCanvas.width =
            imageObject.naturalWidth;

        imageCanvas.height =
            imageObject.naturalHeight;

        paintCanvas.width =
            imageObject.naturalWidth;

        paintCanvas.height =
            imageObject.naturalHeight;

        imageCtx.clearRect(
            0,
            0,
            imageCanvas.width,
            imageCanvas.height
        );

        imageCtx.drawImage(
            imageObject,
            0,
            0
        );

        paintCtx.clearRect(
            0,
            0,
            paintCanvas.width,
            paintCanvas.height
        );

        history = [];

        saveHistory();

    }


    // =====================================================
    // BRUSH SIZE
    // =====================================================

    brushSize.addEventListener(
        "input",
        function () {

            brushValue.textContent =
                this.value + " px";

        }
    );


    // =====================================================
    // DRAWING
    // =====================================================

    function getPosition(event) {

        const rect =
            paintCanvas.getBoundingClientRect();

        let clientX;
        let clientY;

        if (
            event.touches &&
            event.touches.length > 0
        ) {

            clientX =
                event.touches[0].clientX;

            clientY =
                event.touches[0].clientY;

        } else {

            clientX =
                event.clientX;

            clientY =
                event.clientY;

        }

        const scaleX =
            paintCanvas.width /
            rect.width;

        const scaleY =
            paintCanvas.height /
            rect.height;

        return {

            x:
                (clientX - rect.left)
                * scaleX,

            y:
                (clientY - rect.top)
                * scaleY

        };

    }


    function startDrawing(event) {

        event.preventDefault();

        drawing = true;

        const pos =
            getPosition(event);

        paintCtx.beginPath();

        paintCtx.moveTo(
            pos.x,
            pos.y
        );

        draw(event);

    }


    function draw(event) {

        if (!drawing) {
            return;
        }

        event.preventDefault();

        const pos =
            getPosition(event);

        const size =
            Number(
                brushSize.value
            );

        paintCtx.lineWidth =
            size;

        paintCtx.lineCap =
            "round";

        paintCtx.lineJoin =
            "round";

        // Red selection overlay
        paintCtx.strokeStyle =
            "rgba(255, 45, 70, 0.65)";

        paintCtx.lineTo(
            pos.x,
            pos.y
        );

        paintCtx.stroke();

    }


    function stopDrawing() {

        if (!drawing) {
            return;
        }

        drawing = false;

        paintCtx.closePath();

        saveHistory();

    }


    paintCanvas.addEventListener(
        "mousedown",
        startDrawing
    );

    paintCanvas.addEventListener(
        "mousemove",
        draw
    );

    window.addEventListener(
        "mouseup",
        stopDrawing
    );


    paintCanvas.addEventListener(
        "touchstart",
        startDrawing,
        { passive: false }
    );

    paintCanvas.addEventListener(
        "touchmove",
        draw,
        { passive: false }
    );

    paintCanvas.addEventListener(
        "touchend",
        stopDrawing
    );


    // =====================================================
    // HISTORY / UNDO
    // =====================================================

    function saveHistory() {

        history.push(
            paintCtx.getImageData(
                0,
                0,
                paintCanvas.width,
                paintCanvas.height
            )
        );

        if (history.length > 20) {

            history.shift();

        }

    }


    undoButton.addEventListener(
        "click",
        function () {

            if (history.length <= 1) {

                paintCtx.clearRect(
                    0,
                    0,
                    paintCanvas.width,
                    paintCanvas.height
                );

                return;

            }

            history.pop();

            const previous =
                history[
                    history.length - 1
                ];

            paintCtx.putImageData(
                previous,
                0,
                0
            );

        }
    );


    // =====================================================
    // CLEAR
    // =====================================================

    clearButton.addEventListener(
        "click",
        function () {

            paintCtx.clearRect(
                0,
                0,
                paintCanvas.width,
                paintCanvas.height
            );

            history = [];

            saveHistory();

            resultBox.style.display =
                "none";

            errorBox.style.display =
                "none";

        }
    );


    // =====================================================
    // METHOD SELECTION
    // =====================================================

    const methods =
        document.querySelectorAll(
            ".method"
        );

    methods.forEach(
        function (method) {

            method.addEventListener(
                "click",
                function () {

                    methods.forEach(
                        function (item) {

                            item.classList.remove(
                                "active"
                            );

                        }
                    );

                    this.classList.add(
                        "active"
                    );

                    selectedMethod =
                        this.dataset.method;

                }
            );

        }
    );


    // =====================================================
    // CREATE MASK
    // =====================================================

    function createMaskBlob() {

        return new Promise(
            function (resolve) {

                const maskCanvas =
                    document.createElement(
                        "canvas"
                    );

                maskCanvas.width =
                    paintCanvas.width;

                maskCanvas.height =
                    paintCanvas.height;

                const maskCtx =
                    maskCanvas.getContext(
                        "2d"
                    );

                // Transparent background
                maskCtx.clearRect(
                    0,
                    0,
                    maskCanvas.width,
                    maskCanvas.height
                );

                // Convert any painted pixels
                // into white mask
                const data =
                    paintCtx.getImageData(
                        0,
                        0,
                        paintCanvas.width,
                        paintCanvas.height
                    );

                const pixels =
                    data.data;

                for (
                    let i = 0;
                    i < pixels.length;
                    i += 4
                ) {

                    const alpha =
                        pixels[i + 3];

                    if (alpha > 0) {

                        pixels[i] =
                            255;

                        pixels[i + 1] =
                            255;

                        pixels[i + 2] =
                            255;

                        pixels[i + 3] =
                            255;

                    } else {

                        pixels[i] =
                            0;

                        pixels[i + 1] =
                            0;

                        pixels[i + 2] =
                            0;

                        pixels[i + 3] =
                            255;

                    }

                }

                maskCtx.putImageData(
                    data,
                    0,
                    0
                );

                maskCanvas.toBlob(
                    function (blob) {

                        resolve(blob);

                    },
                    "image/png"
                );

            }
        );

    }


    // =====================================================
    // REMOVE OBJECT
    // =====================================================

    removeButton.addEventListener(
        "click",
        async function () {

            errorBox.style.display =
                "none";

            resultBox.style.display =
                "none";

            // Make sure something was selected
            const pixels =
                paintCtx.getImageData(
                    0,
                    0,
                    paintCanvas.width,
                    paintCanvas.height
                ).data;

            let hasSelection = false;

            for (
                let i = 3;
                i < pixels.length;
                i += 4
            ) {

                if (
                    pixels[i] > 10
                ) {

                    hasSelection = true;

                    break;

                }

            }

            if (!hasSelection) {

                showError(
                    "Please paint over the object you want to remove."
                );

                return;

            }

            // Loading state
            removeButton.disabled =
                true;

            loading.style.display =
                "block";

            if (
                selectedMethod === "ai"
            ) {

                loadingText.textContent =
                    "🤖 AI is removing the object... This may take some time.";

            } else {

                loadingText.textContent =
                    "⚡ Removing object...";

            }

            try {

                const maskBlob =
                    await createMaskBlob();

                const formData =
                    new FormData();

                formData.append(
                    "image",
                    originalFile
                );

                formData.append(
                    "mask",
                    maskBlob,
                    "mask.png"
                );

                formData.append(
                    "method",
                    selectedMethod
                );

                const response =
                    await fetch(
                        "/process",
                        {
                            method:
                                "POST",

                            body:
                                formData
                        }
                    );

                if (!response.ok) {

                    let message =
                        "Image processing failed.";

                    try {

                        const errorData =
                            await response.json();

                        if (
                            errorData.error
                        ) {

                            message =
                                errorData.error;

                        }

                        if (
                            errorData.details
                        ) {

                            message +=
                                " " +
                                errorData.details;

                        }

                    } catch (e) {}

                    throw new Error(
                        message
                    );

                }

                const blob =
                    await response.blob();

                const resultUrl =
                    URL.createObjectURL(
                        blob
                    );

                resultImage.src =
                    resultUrl;

                resultBox.style.display =
                    "block";

                resultBox.scrollIntoView(
                    {
                        behavior:
                            "smooth",
                        block:
                            "start"
                    }
                );

            } catch (error) {

                console.error(
                    error
                );

                showError(
                    error.message ||
                    "Something went wrong."
                );

            } finally {

                removeButton.disabled =
                    false;

                loading.style.display =
                    "none";

            }

        }
    );


    // =====================================================
    // ERROR
    // =====================================================

    function showError(message) {

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

    }


    // =====================================================
    // DOWNLOAD
    // =====================================================

    downloadButton.addEventListener(
        "click",
        function () {

            if (
                !resultImage.src
            ) {

                return;

            }

            const link =
                document.createElement(
                    "a"
                );

            link.href =
                resultImage.src;

            link.download =
                "image-eraser-result.jpg";

            document.body.appendChild(
                link
            );

            link.click();

            link.remove();

        }
    );

</script>

</body>

</html>
