<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Photo Eraser ✨💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff758c;
      --secondary: #ff7eb3;
      --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #4a4a4a;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(255, 117, 140, 0.25);
      width: 100%;
      max-width: 900px;
      text-align: center;
      border: 2px solid #ffffff;
    }

    h1 {
      color: #d83a56;
      font-size: 2.2rem;
      margin-bottom: 5px;
    }

    p.subtitle {
      color: #884466;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: #fff0f5;
      padding: 15px;
      border-radius: 20px;
    }

    .btn {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 117, 140, 0.45);
    }

    .btn.active {
      outline: 3px solid #d83a56;
      background: #d83a56;
    }

    .btn-secondary {
      background: #ffffff;
      color: #d83a56;
      border: 2px solid #ffb6c1;
    }

    .canvas-wrapper {
      position: relative;
      margin: 20px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      background: #fff;
      display: inline-block;
      max-width: 100%;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      cursor: crosshair;
    }

    #resultContainer {
      margin-top: 25px;
      display: none;
      animation: fadeIn 0.5s ease-in-out;
    }

    #resultImage {
      max-width: 100%;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 4px solid #fff;
    }

    .status-spinner {
      display: none;
      color: #d83a56;
      font-weight: 600;
      margin: 15px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Magic Photo Eraser ✨🌸</h1>
    <p class="subtitle">Upload your picture & effortlessly remove anything!</p>

    <input type="file" id="uploadInput" accept="image/*" style="display: none;">
    <button class="btn" style="margin: 0 auto 20px auto;" onclick="document.getElementById('uploadInput').click()">
      📸 Upload Image
    </button>

    <div class="toolbar" id="toolbar" style="display: none;">
      <button class="btn btn-secondary active" id="btnBrush" onclick="setMode('brush')">🖌️ Manual Brush</button>
      <button class="btn btn-secondary" id="btnMagic" onclick="setMode('magic')">🪄 Magic Auto-Select</button>
      
      <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; color: #d83a56;">
        Size: <input type="range" id="brushSize" min="5" max="60" value="25">
      </label>

      <button class="btn btn-secondary" onclick="clearCanvas()">🔄 Reset Selection</button>
      <button class="btn" onclick="processImage()">✨ Erase & Reveal</button>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper" style="display: none;">
      <canvas id="imageCanvas"></canvas>
    </div>

    <div class="status-spinner" id="loadingSpinner">
      🪄 Magic is happening... Please wait! 💖
    </div>

    <div id="resultContainer">
      <h3 style="color: #d83a56;">✨ Result Magic Reveal ✨</h3>
      <img id="resultImage" alt="Magic Result">
      <br><br>
      <a id="downloadBtn" class="btn" style="display: inline-flex; text-decoration: none;" download="erased_magic.jpg">
        💖 Download Clean Photo
      </a>
    </div>
  </div>

  <script>
    const uploadInput = document.getElementById('uploadInput');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    let currentImage = null;
    let mode = 'brush'; // 'brush' or 'magic'
    let isDrawing = false;
    
    // Hidden canvas for mask layer
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');

    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        currentImage = img;
        canvas.width = img.width;
        canvas.height = img.height;
        maskCanvas.width = img.width;
        maskCanvas.height = img.height;

        render();
        document.getElementById('toolbar').style.display = 'flex';
        document.getElementById('canvasWrapper').style.display = 'inline-block';
        document.getElementById('resultContainer').style.display = 'none';
      };
      img.src = URL.createObjectURL(file);
    });

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(currentImage, 0, 0);

      // Draw mask overlay with pink glow
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.drawImage(maskCanvas, 0, 0);
      ctx.restore();
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('btnBrush').classList.toggle('active', mode === 'brush');
      document.getElementById('btnMagic').classList.toggle('active', mode === 'magic');
    }

    // Drawing Events
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);

      if (mode === 'brush') {
        isDrawing = true;
        drawBrush(x, y);
      } else if (mode === 'magic') {
        performMagicSelect(x, y);
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing || mode !== 'brush') return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      drawBrush((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
    });

    window.addEventListener('mouseup', () => isDrawing = false);

    function drawBrush(x, y) {
      const size = document.getElementById('brushSize').value;
      maskCtx.fillStyle = '#ff1493';
      maskCtx.beginPath();
      maskCtx.arc(x, y, size / 2, 0, Math.PI * 2);
      maskCtx.fill();
      render();
    }

    function clearCanvas() {
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      render();
    }

    async function performMagicSelect(x, y) {
      document.getElementById('loadingSpinner').style.display = 'block';
      const file = uploadInput.files[0];
      const formData = new FormData();
      formData.append('image', file);
      formData.append('x', x);
      formData.append('y', y);

      try {
        const response = await fetch('/magic-select', { method: 'POST', body: formData });
        if (!response.ok) throw new Error('Magic select failed');
        
        const blob = await response.blob();
        const maskImg = new Image();
        maskImg.onload = () => {
          // Fill mask canvas with the auto-selected region
          maskCtx.drawImage(maskImg, 0, 0);
          render();
          document.getElementById('loadingSpinner').style.display = 'none';
        };
        maskImg.src = URL.createObjectURL(blob);
      } catch (err) {
        alert(err.message);
        document.getElementById('loadingSpinner').style.display = 'none';
      }
    }

    async function processImage() {
      document.getElementById('loadingSpinner').style.display = 'block';
      document.getElementById('resultContainer').style.display = 'none';

      // Convert maskCanvas to Blob
      maskCanvas.toBlob(async (maskBlob) => {
        const formData = new FormData();
        formData.append('image', uploadInput.files[0]);
        formData.append('mask', maskBlob, 'mask.png');
        formData.append('method', 'ai');

        try {
          const res = await fetch('/process', { method: 'POST', body: formData });
          if (!res.ok) throw new Error('Processing error');

          const resultBlob = await res.blob();
          const resultUrl = URL.createObjectURL(resultBlob);
          
          document.getElementById('resultImage').src = resultUrl;
          document.getElementById('downloadBtn').href = resultUrl;
          document.getElementById('resultContainer').style.display = 'block';
        } catch (e) {
          alert("Error: " + e.message);
        } finally {
          document.getElementById('loadingSpinner').style.display = 'none';
        }
      }, 'image/png');
    }
  </script>
</body>
</html>
