<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>AI Image Eraser</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            overflow-x: hidden;
        }

        header {
            padding: 18px;
            text-align: center;
            background: #181818;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 23px;
        }

        header p {
            margin: 7px 0 0;
            color: #aaa;
            font-size: 13px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 15px;
        }

        /* =========================
           Upload
        ========================= */

        .upload-box {
            border: 2px dashed #555;
            border-radius: 16px;
            padding: 22px;
            text-align: center;
            background: #191919;
            margin-bottom: 15px;
        }

        .upload-box input {
            display: none;
        }

        .upload-button {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 12px;
            background: #fff;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        /* =========================
           Toolbar
        ========================= */

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            background: #1b1b1b;
            border-radius: 14px;
            margin-bottom: 12px;
            justify-content: center;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 14px;
            background: #292929;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button.active {
            background: #fff;
            color: #111;
        }

        button.remove {
            background: #d92d20;
            font-weight: bold;
            padding-left: 20px;
            padding-right: 20px;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* =========================
           Brush controls
        ========================= */

        .controls {
            background: #191919;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .controls-row:last-child {
            margin-bottom: 0;
        }

        .controls label {
            min-width: 80px;
            color: #ccc;
            font-size: 13px;
        }

        input[type="range"] {
            flex: 1;
        }

        .value {
            width: 50px;
            text-align: center;
            color: #fff;
        }

        /* =========================
           Canvas area
        ========================= */

        .workspace {
            width: 100%;
            display: flex;
            justify-content: center;
            background:
                repeating-conic-gradient(#222 0% 25%, #181818 0% 50%)
                50% / 20px 20px;
            border-radius: 16px;
            padding: 10px;
            overflow: auto;
            touch-action: none;
        }

        .canvas-wrap {
            position: relative;
            display: inline-block;
            max-width: 100%;
            line-height: 0;
            touch-action: none;
        }

        #imageCanvas,
        #maskCanvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        #imageCanvas {
            position: relative;
            z-index: 1;
        }

        #maskCanvas {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* =========================
           Brush cursor
        ========================= */

        #brushCursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow:
                0 0 0 1px black,
                0 0 8px rgba(0,0,0,.8);
        }

        /* =========================
           Result
        ========================= */

        .result-section {
            margin-top: 20px;
            display: none;
        }

        .result-section h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #resultImage {
            width: 100%;
            border-radius: 14px;
            display: block;
        }

        .download {
            display: inline-block;
            margin-top: 12px;
            padding: 13px 20px;
            border-radius: 10px;
            background: white;
            color: black;
            text-decoration: none;
            font-weight: bold;
        }

        /* =========================
           Status
        ========================= */

        #status {
            display: none;
            margin: 12px 0;
            padding: 13px;
            border-radius: 10px;
            background: #252525;
            text-align: center;
            color: #ddd;
        }

        .hint {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 20px;
            }

            button {
                padding: 10px 11px;
                font-size: 13px;
            }

            .container {
                padding: 10px;
            }

            .workspace {
                padding: 5px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>✨ AI Image Eraser</h1>
    <p>حدد العنصر بالفرشة ثم احذفه بالذكاء الاصطناعي</p>
</header>


<div class="container">

    <!-- =========================
         Upload
    ========================== -->

    <div class="upload-box">

        <label for="imageInput" class="upload-button">
            📷 اختر الصورة
        </label>

        <input
            id="imageInput"
            type="file"
            accept="image/*"
        >

        <p id="fileName">
            لم يتم اختيار صورة
        </p>

    </div>


    <!-- =========================
         Toolbar
    ========================== -->

    <div class="toolbar">

        <button
            id="brushBtn"
            class="active"
            onclick="setTool('brush')"
        >
            🖌️ تحديد
        </button>

        <button
            id="eraseBtn"
            onclick="setTool('erase')"
        >
            🧽 مسح التحديد
        </button>

        <button
            onclick="undo()"
        >
            ↩️ تراجع
        </button>

        <button
            onclick="redo()"
        >
            ↪️ إعادة
        </button>

        <button
            onclick="clearMask()"
        >
            🗑️ مسح الكل
        </button>

        <button
            id="removeBtn"
            class="remove"
            onclick="removeObject()"
            disabled
        >
            ✨ إزالة العنصر
        </button>

    </div>


    <!-- =========================
         Brush Size
    ========================== -->

    <div class="controls">

        <div class="controls-row">

            <label>
                حجم الفرشة
            </label>

            <input
                id="brushSize"
                type="range"
                min="5"
                max="200"
                value="45"
            >

            <span
                id="brushSizeValue"
                class="value"
            >
                45
            </span>

        </div>

    </div>


    <!-- =========================
         Status
    ========================== -->

    <div id="status"></div>


    <!-- =========================
         Canvas
    ========================== -->

    <div
        id="workspace"
        class="workspace"
    >

        <div
            id="canvasWrap"
            class="canvas-wrap"
        >

            <canvas
                id="imageCanvas"
            ></canvas>

            <canvas
                id="maskCanvas"
            ></canvas>

        </div>

    </div>


    <div class="hint">
        🖌️ ارسم فوق العنصر الذي تريد حذفه
        <br>
        الأبيض = سيتم حذفه
    </div>


    <!-- =========================
         Result
    ========================== -->

    <div
        id="resultSection"
        class="result-section"
    >

        <h2>
            ✨ النتيجة
        </h2>

        <img
            id="resultImage"
            alt="Result"
        >

        <a
            id="downloadBtn"
            class="download"
            download="removed-object.png"
        >
            ⬇️ تحميل الصورة
        </a>

    </div>

</div>


<div id="brushCursor"></div>


<script>

    // =====================================================
    // Elements
    // =====================================================

    const imageInput =
        document.getElementById("imageInput");

    const imageCanvas =
        document.getElementById("imageCanvas");

    const maskCanvas =
        document.getElementById("maskCanvas");

    const imageCtx =
        imageCanvas.getContext("2d");

    const maskCtx =
        maskCanvas.getContext("2d");

    const canvasWrap =
        document.getElementById("canvasWrap");

    const workspace =
        document.getElementById("workspace");

    const brushSize =
        document.getElementById("brushSize");

    const brushSizeValue =
        document.getElementById("brushSizeValue");

    const statusBox =
        document.getElementById("status");

    const removeBtn =
        document.getElementById("removeBtn");

    const resultSection =
        document.getElementById("resultSection");

    const resultImage =
        document.getElementById("resultImage");

    const downloadBtn =
        document.getElementById("downloadBtn");

    const brushCursor =
        document.getElementById("brushCursor");


    // =====================================================
    // State
    // =====================================================

    let imageLoaded = false;

    let drawing = false;

    let tool = "brush";

    let history = [];

    let historyIndex = -1;

    let lastPoint = null;


    // =====================================================
    // Image upload
    // =====================================================

    imageInput.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file) {
                return;
            }

            document.getElementById("fileName")
                .textContent = file.name;

            const img =
                new Image();

            img.onload = function () {

                imageCanvas.width =
                    img.naturalWidth;

                imageCanvas.height =
                    img.naturalHeight;

                maskCanvas.width =
                    img.naturalWidth;

                maskCanvas.height =
                    img.naturalHeight;

                imageCtx.clearRect(
                    0,
                    0,
                    imageCanvas.width,
                    imageCanvas.height
                );

                maskCtx.clearRect(
                    0,
                    0,
                    maskCanvas.width,
                    maskCanvas.height
                );

                imageCtx.drawImage(
                    img,
                    0,
                    0
                );

                imageLoaded = true;

                history = [];

                historyIndex = -1;

                saveHistory();

                removeBtn.disabled = false;

                resultSection.style.display =
                    "none";

                showStatus(
                    "الصورة جاهزة. حددي العنصر بالفرشة 🖌️",
                    false
                );
            };

            img.src =
                URL.createObjectURL(file);
        }
    );


    // =====================================================
    // Brush size
    // =====================================================

    brushSize.addEventListener(
        "input",
        function () {

            brushSizeValue.textContent =
                this.value;

            updateCursor();
        }
    );


    // =====================================================
    // Tool
    // =====================================================

    function setTool(newTool) {

        tool = newTool;

        document
            .getElementById("brushBtn")
            .classList.toggle(
                "active",
                tool === "brush"
            );

        document
            .getElementById("eraseBtn")
            .classList.toggle(
                "active",
                tool === "erase"
            );
    }


    // =====================================================
    // Coordinate conversion
    // =====================================================

    function getCanvasPoint(event) {

        const rect =
            maskCanvas.getBoundingClientRect();

        const scaleX =
            maskCanvas.width /
            rect.width;

        const scaleY =
            maskCanvas.height /
            rect.height;

        return {
            x: (event.clientX - rect.left) * scaleX,
            y: (event.clientY - rect.top) * scaleY
        };
    }


    // =====================================================
    // Drawing
    // =====================================================

    function drawAt(point) {

        const size =
            Number(brushSize.value);

        maskCtx.save();

        maskCtx.lineCap = "round";
        maskCtx.lineJoin = "round";

        if (tool === "brush") {

            // White = remove
            maskCtx.globalCompositeOperation =
                "source-over";

            maskCtx.strokeStyle =
                "rgba(255,255,255,0.75)";

            maskCtx.fillStyle =
                "rgba(255,255,255,0.75)";

        } else {

            // Erase mask
            maskCtx.globalCompositeOperation =
                "destination-out";

            maskCtx.strokeStyle =
                "rgba(0,0,0,1)";

            maskCtx.fillStyle =
                "rgba(0,0,0,1)";
        }

        if (lastPoint) {

            maskCtx.lineWidth =
                size;

            maskCtx.beginPath();

            maskCtx.moveTo(
                lastPoint.x,
                lastPoint.y
            );

            maskCtx.lineTo(
                point.x,
                point.y
            );

            maskCtx.stroke();

        } else {

            maskCtx.beginPath();

            maskCtx.arc(
                point.x,
                point.y,
                size / 2,
                0,
                Math.PI * 2
            );

            maskCtx.fill();
        }

        maskCtx.restore();

        lastPoint = point;
    }


    // =====================================================
    // Pointer events
    // =====================================================

    maskCanvas.addEventListener(
        "pointerdown",
        function (event) {

            if (!imageLoaded) {
                return;
            }

            event.preventDefault();

            drawing = true;

            maskCanvas.setPointerCapture(
                event.pointerId
            );

            lastPoint =
                getCanvasPoint(event);

            drawAt(lastPoint);
        }
    );


    maskCanvas.addEventListener(
        "pointermove",
        function (event) {

            if (!imageLoaded) {
                return;
            }

            updateCursor(event);

            if (!drawing) {
                return;
            }

            event.preventDefault();

            const point =
                getCanvasPoint(event);

            drawAt(point);
        }
    );


    maskCanvas.addEventListener(
        "pointerup",
        function (event) {

            if (!drawing) {
                return;
            }

            drawing = false;

            lastPoint = null;

            try {
                maskCanvas.releasePointerCapture(
                    event.pointerId
                );
            } catch (e) {}

            saveHistory();
        }
    );


    maskCanvas.addEventListener(
        "pointercancel",
        function () {

            drawing = false;

            lastPoint = null;
        }
    );


    // =====================================================
    // Cursor
    // =====================================================

    function updateCursor(event) {

        const size =
            Number(brushSize.value);

        brushCursor.style.width =
            size + "px";

        brushCursor.style.height =
            size + "px";

        if (event) {

            brushCursor.style.left =
                event.clientX + "px";

            brushCursor.style.top =
                event.clientY + "px";

            brushCursor.style.display =
                "block";

        }
    }


    maskCanvas.addEventListener(
        "pointerenter",
        function (event) {

            updateCursor(event);
        }
    );


    maskCanvas.addEventListener(
        "pointerleave",
        function () {

            if (!drawing) {
                brushCursor.style.display =
                    "none";
            }
        }
    );


    // =====================================================
    // History
    // =====================================================

    function saveHistory() {

        if (!imageLoaded) {
            return;
        }

        const data =
            maskCanvas.toDataURL();

        history =
            history.slice(
                0,
                historyIndex + 1
            );

        history.push(data);

        historyIndex =
            history.length - 1;

        // Keep memory reasonable
        if (history.length > 20) {

            history.shift();

            historyIndex--;
        }
    }


    function restoreHistory(index) {

        if (
            index < 0 ||
            index >= history.length
        ) {
            return;
        }

        const img =
            new Image();

        img.onload = function () {

            maskCtx.clearRect(
                0,
                0,
                maskCanvas.width,
                maskCanvas.height
            );

            maskCtx.drawImage(
                img,
                0,
                0
            );
        };

        img.src =
            history[index];
    }


    function undo() {

        if (historyIndex <= 0) {
            return;
        }

        historyIndex--;

        restoreHistory(
            historyIndex
        );
    }


    function redo() {

        if (
            historyIndex >=
            history.length - 1
        ) {
            return;
        }

        historyIndex++;

        restoreHistory(
            historyIndex
        );
    }


    // =====================================================
    // Clear mask
    // =====================================================

    function clearMask() {

        if (!imageLoaded) {
            return;
        }

        maskCtx.clearRect(
            0,
            0,
            maskCanvas.width,
            maskCanvas.height
        );

        saveHistory();
    }


    // =====================================================
    // Check if mask contains pixels
    // =====================================================

    function maskHasPixels() {

        const data =
            maskCtx.getImageData(
                0,
                0,
                maskCanvas.width,
                maskCanvas.height
            ).data;

        for (
            let i = 3;
            i < data.length;
            i += 4
        ) {

            if (data[i] > 10) {
                return true;
            }
        }

        return false;
    }


    // =====================================================
    // Remove object
    // =====================================================

    async function removeObject() {

        if (!imageLoaded) {

            showStatus(
                "اختاري صورة أولاً.",
                true
            );

            return;
        }

        if (!maskHasPixels()) {

            showStatus(
                "حددي العنصر الذي تريدين حذفه أولاً 🖌️",
                true
            );

            return;
        }

        removeBtn.disabled = true;

        showStatus(
            "⏳ جاري إزالة العنصر وإعادة بناء الخلفية بالـ AI...",
            false
        );

        try {

            // -------------------------------------------------
            // Convert canvas image to Blob
            // -------------------------------------------------

            const imageBlob =
                await canvasToBlob(
                    imageCanvas,
                    "image/png"
                );


            // -------------------------------------------------
            // Convert mask to proper PNG
            // -------------------------------------------------

            const maskBlob =
                await canvasToBlob(
                    maskCanvas,
                    "image/png"
                );


            // -------------------------------------------------
            // FormData
            // -------------------------------------------------

            const formData =
                new FormData();

            formData.append(
                "image",
                imageBlob,
                "image.png"
            );

            formData.append(
                "mask",
                maskBlob,
                "mask.png"
            );

            formData.append(
                "method",
                "ai"
            );


            // -------------------------------------------------
            // Send to Flask
            // -------------------------------------------------

            const response =
                await fetch(
                    "/process",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            if (!response.ok) {

                let message =
                    "حدث خطأ أثناء المعالجة.";

                try {

                    const error =
                        await response.json();

                    message =
                        error.error ||
                        error.details ||
                        message;

                } catch (e) {}

                throw new Error(
                    message
                );
            }


            // -------------------------------------------------
            // Result blob
            // -------------------------------------------------

            const resultBlob =
                await response.blob();

            const resultURL =
                URL.createObjectURL(
                    resultBlob
                );


            resultImage.src =
                resultURL;

            downloadBtn.href =
                resultURL;

            resultSection.style.display =
                "block";

            showStatus(
                "✅ تم حذف العنصر بنجاح!",
                false
            );

            // Scroll to result
            setTimeout(
                function () {

                    resultSection.scrollIntoView({
                        behavior: "smooth"
                    });

                },
                300
            );

        } catch (error) {

            console.error(error);

            showStatus(
                "❌ " + error.message,
                true
            );

        } finally {

            removeBtn.disabled = false;
        }
    }


    // =====================================================
    // Canvas -> Blob
    // =====================================================

    function canvasToBlob(
        canvas,
        type
    ) {

        return new Promise(
            function (resolve) {

                canvas.toBlob(
                    function (blob) {

                        resolve(blob);

                    },
                    type
                );
            }
        );
    }


    // =====================================================
    // Status
    // =====================================================

    function showStatus(
        message,
        error
    ) {

        statusBox.style.display =
            "block";

        statusBox.textContent =
            message;

        if (error) {

            statusBox.style.color =
                "#ff7777";

        } else {

            statusBox.style.color =
                "#ddd";
        }
    }


    // =====================================================
    // Keyboard shortcuts
    // =====================================================

    document.addEventListener(
        "keydown",
        function (event) {

            // Ctrl/Cmd + Z
            if (
                (event.ctrlKey ||
                 event.metaKey) &&
                event.key.toLowerCase() === "z"
            ) {

                event.preventDefault();

                undo();
            }

            // Ctrl/Cmd + Y
            if (
                (event.ctrlKey ||
                 event.metaKey) &&
                event.key.toLowerCase() === "y"
            ) {

                event.preventDefault();

                redo();
            }
        }
    );

</script>

</body>
</html>
