<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AI Object Eraser</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

:root {
    --pink: #ec4899;
    --pink2: #f472b6;
    --purple: #a855f7;
    --bg: #fdf2f8;
    --card: #ffffff;
    --text: #475569;
}

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            #fbcfe8 1px,
            transparent 1px
        );

    background-size: 24px 24px;

    background-color: var(--bg);

    color: var(--text);

}

header {

    padding: 18px 24px;

    background:
        rgba(255,255,255,.9);

    backdrop-filter:
        blur(12px);

    border-bottom:
        2px solid #fce7f3;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

}

.brand {

    display: flex;

    align-items: center;

    gap: 12px;

}

.logo {

    width: 44px;
    height: 44px;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            var(--pink),
            var(--purple)
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

}

.title {

    font-weight: 800;

    font-size: 18px;

    background:
        linear-gradient(
            135deg,
            #db2777,
            #9333ea
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color:
        transparent;

}

.workspace {

    max-width: 1500px;

    margin: auto;

    padding: 20px;

    display: grid;

    grid-template-columns:
        310px 1fr;

    gap: 20px;

}

.sidebar {

    background: white;

    border:
        2px solid #fce7f3;

    border-radius: 24px;

    padding: 20px;

    box-shadow:
        0 10px 30px
        rgba(236,72,153,.08);

    height: fit-content;

}

.section {

    margin-bottom: 20px;

}

.section-title {

    font-size: 12px;

    font-weight: 800;

    text-transform:
        uppercase;

    color: #94a3b8;

    margin-bottom: 9px;

}

.upload {

    border:
        2px dashed
        var(--pink);

    border-radius: 17px;

    padding: 20px;

    text-align: center;

    color: var(--pink);

    cursor: pointer;

}

.upload input {
    display: none;
}

.tools {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

}

.tool {

    border:
        2px solid #fce7f3;

    background: white;

    border-radius: 15px;

    padding: 12px 5px;

    text-align: center;

    cursor: pointer;

    font-weight: 700;

    font-size: 13px;

}

.tool.active {

    background: #fdf2f8;

    border-color:
        var(--pink);

    color:
        #db2777;

}

.methods {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

}

.method {

    border:
        2px solid #fce7f3;

    background: white;

    border-radius: 15px;

    padding: 12px 5px;

    text-align: center;

    cursor: pointer;

    font-weight: 700;

    font-size: 13px;

}

.method.active {

    background: #fdf2f8;

    border-color:
        var(--pink);

    color:
        #db2777;

}

.slider {

    background:
        #f8fafc;

    border-radius:
        15px;

    padding: 13px;

}

.slider-head {

    display: flex;

    justify-content:
        space-between;

    margin-bottom: 8px;

    font-size: 13px;

    font-weight: 700;

}

input[type="range"] {
    width: 100%;
    accent-color: var(--pink);
}

.actions {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

}

button {

    border: 0;

    border-radius: 15px;

    padding: 13px;

    font-weight: 700;

    cursor: pointer;

}

.secondary {

    background: #f1f5f9;

    color: #475569;

}

.primary {

    width: 100%;

    margin-top: 10px;

    background:
        linear-gradient(
            135deg,
            var(--pink),
            #db2777
        );

    color: white;

    padding: 16px;

    font-size: 15px;

}

.primary:disabled {

    opacity: .45;

}

.display {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 18px;

}

.panel {

    background: white;

    border:
        2px solid #fce7f3;

    border-radius: 24px;

    overflow: hidden;

    min-height: 600px;

}

.panel-title {

    padding: 14px 18px;

    background:
        #fdf2f8;

    color:
        #db2777;

    font-weight: 800;

}

.viewport {

    height: 600px;

    display: flex;

    justify-content:
        center;

    align-items:
        center;

    background: #fafafa;

    overflow: hidden;

    position: relative;

}

.canvas-wrap {

    position: relative;

    max-width: 100%;

    max-height: 100%;

}

canvas {

    display: block;

    max-width: 100%;

    max-height: 570px;

}

#maskCanvas {

    position: absolute;

    left: 0;

    top: 0;

    cursor: crosshair;

    touch-action: none;

}

#resultImage {

    max-width: 100%;

    max-height: 570px;

    display: none;

}

.loader {

    display: none;

    position: absolute;

    inset: 0;

    background:
        rgba(255,255,255,.85);

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    gap: 12px;

}

.spinner {

    width: 45px;

    height: 45px;

    border:
        4px solid #fbcfe8;

    border-top-color:
        var(--pink);

    border-radius: 50%;

    animation:
        spin .8s linear infinite;

}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}

@media(max-width:900px) {

    .workspace {

        grid-template-columns:
            1fr;

    }

    .display {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<header>

    <div class="brand">

        <div class="logo">
            ✨
        </div>

        <div class="title">
            AI Object Eraser
        </div>

    </div>

    <div>
        ✨ Aesthetic AI Studio
    </div>

</header>


<div class="workspace">


<!-- =====================================================
SIDEBAR
===================================================== -->

<aside class="sidebar">


<div class="section">

<div class="section-title">
Upload
</div>

<label class="upload">

📷 Choose Image

<input
    type="file"
    id="imageLoader"
    accept="image/*"
>

</label>

</div>


<!-- SELECTION TOOL -->

<div class="section">

<div class="section-title">
Selection Tool
</div>


<div class="tools">

<div
    class="tool active"
    id="brushTool"
    onclick="setSelectionMode('brush')"
>
🖌️ Brush
</div>


<div
    class="tool"
    id="outlineTool"
    onclick="setSelectionMode('outline')"
>
🪄 Smart Outline
</div>

</div>

</div>


<!-- METHOD -->

<div class="section">

<div class="section-title">
Removal Method
</div>


<div class="methods">

<div
    class="method active"
    id="aiMethod"
    onclick="setMethod('ai')"
>
🤖 AI
</div>


<div
    class="method"
    id="classicMethod"
    onclick="setMethod('classic')"
>
⚡ Classic
</div>

</div>

</div>


<!-- BRUSH -->

<div class="section">

<div class="section-title">
Brush Size
</div>

<div class="slider">

<div class="slider-head">

<span>
Size
</span>

<span id="brushValue">
40 px
</span>

</div>

<input
    type="range"
    id="brushSize"
    min="5"
    max="120"
    value="40"
>

</div>

</div>


<!-- ACTIONS -->

<div class="section">

<div class="section-title">
Actions
</div>

<div class="actions">

<button
    class="secondary"
    onclick="undoMask()"
>
↩️ Undo
</button>

<button
    class="secondary"
    onclick="clearMask()"
>
🗑️ Clear
</button>

</div>

</div>


<button
    class="primary"
    id="processBtn"
    onclick="processImage()"
    disabled
>
✨ Remove Object
</button>


<a
    id="downloadBtn"
    class="primary"
    download="cleaned_image.jpg"
    style="
        display:none;
        text-decoration:none;
        text-align:center;
    "
>
⬇️ Download Result
</a>


</aside>


<!-- =====================================================
DISPLAY
===================================================== -->

<main class="display">


<div class="panel">

<div class="panel-title">
📷 Original / Selection
</div>


<div
    class="viewport"
    id="originalViewport"
>


<div
    id="placeholder"
    style="
        text-align:center;
        color:#cbd5e1;
    "
>

📷

<br>

Upload an image

</div>


<div
    class="canvas-wrap"
    id="canvasWrap"
    style="display:none"
>

<canvas id="imageCanvas"></canvas>

<canvas id="maskCanvas"></canvas>

</div>


</div>

</div>


<div class="panel">

<div class="panel-title">
✨ Result
</div>


<div class="viewport">


<div
    id="resultPlaceholder"
    style="
        color:#cbd5e1;
        text-align:center;
    "
>
Result will appear here
</div>


<img
    id="resultImage"
>


<div
    class="loader"
    id="loader"
>

<div class="spinner"></div>

<div
    id="loaderText"
    style="font-weight:700"
>
Processing...
</div>

</div>


</div>

</div>


</main>

</div>


<script>

lucide.createIcons();


const imageLoader =
    document.getElementById(
        "imageLoader"
    );


const imageCanvas =
    document.getElementById(
        "imageCanvas"
    );


const maskCanvas =
    document.getElementById(
        "maskCanvas"
    );


const imageCtx =
    imageCanvas.getContext(
        "2d"
    );


const maskCtx =
    maskCanvas.getContext(
        "2d"
    );


const processBtn =
    document.getElementById(
        "processBtn"
    );


const brushSize =
    document.getElementById(
        "brushSize"
    );


const brushValue =
    document.getElementById(
        "brushValue"
    );


const loader =
    document.getElementById(
        "loader"
    );


const loaderText =
    document.getElementById(
        "loaderText"
    );


const resultImage =
    document.getElementById(
        "resultImage"
    );


const downloadBtn =
    document.getElementById(
        "downloadBtn"
    );


let currentImage = null;

let selectedMethod = "ai";

let selectionMode = "brush";

let drawing = false;

let history = [];

let outlinePoints = [];


/* =====================================================
IMAGE
===================================================== */

imageLoader.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file)
            return;

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                currentImage =
                    new Image();

                currentImage.onload =
                    function() {

                        imageCanvas.width =
                            currentImage.naturalWidth;

                        imageCanvas.height =
                            currentImage.naturalHeight;

                        maskCanvas.width =
                            currentImage.naturalWidth;

                        maskCanvas.height =
                            currentImage.naturalHeight;

                        imageCtx.clearRect(
                            0,
                            0,
                            imageCanvas.width,
                            imageCanvas.height
                        );

                        imageCtx.drawImage(
                            currentImage,
                            0,
                            0
                        );

                        clearMask();

                        document
                            .getElementById(
                                "placeholder"
                            )
                            .style.display =
                            "none";

                        document
                            .getElementById(
                                "canvasWrap"
                            )
                            .style.display =
                            "inline-block";

                        processBtn.disabled =
                            false;

                    };

                currentImage.src =
                    e.target.result;

            };

        reader.readAsDataURL(
            file
        );

    }
);


/* =====================================================
METHOD
===================================================== */

function setMethod(method) {

    selectedMethod =
        method;

    document
        .getElementById(
            "aiMethod"
        )
        .classList.toggle(
            "active",
            method === "ai"
        );

    document
        .getElementById(
            "classicMethod"
        )
        .classList.toggle(
            "active",
            method === "classic"
        );

}


/* =====================================================
SELECTION MODE
===================================================== */

function setSelectionMode(mode) {

    selectionMode =
        mode;

    document
        .getElementById(
            "brushTool"
        )
        .classList.toggle(
            "active",
            mode === "brush"
        );

    document
        .getElementById(
            "outlineTool"
        )
        .classList.toggle(
            "active",
            mode === "outline"
        );

    clearMask();

}


/* =====================================================
BRUSH
===================================================== */

brushSize.addEventListener(
    "input",
    function() {

        brushValue.innerText =
            this.value +
            " px";

    }
);


/* =====================================================
COORDINATES
===================================================== */

function getPosition(e) {

    const rect =
        maskCanvas.getBoundingClientRect();

    let clientX;
    let clientY;

    if (
        e.touches &&
        e.touches.length
    ) {

        clientX =
            e.touches[0].clientX;

        clientY =
            e.touches[0].clientY;

    } else {

        clientX =
            e.clientX;

        clientY =
            e.clientY;

    }

    const scaleX =
        maskCanvas.width /
        rect.width;

    const scaleY =
        maskCanvas.height /
        rect.height;

    return {

        x:
            (clientX - rect.left)
            * scaleX,

        y:
            (clientY - rect.top)
            * scaleY

    };

}


/* =====================================================
POINTER START
===================================================== */

maskCanvas.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        maskCanvas.setPointerCapture(
            e.pointerId
        );

        drawing = true;

        if (
            selectionMode ===
            "outline"
        ) {

            outlinePoints = [];

            const p =
                getPosition(e);

            outlinePoints.push(p);

            maskCtx.beginPath();

            maskCtx.moveTo(
                p.x,
                p.y
            );

        } else {

            saveHistory();

            drawBrush(e);

        }

    }
);


/* =====================================================
POINTER MOVE
===================================================== */

maskCanvas.addEventListener(
    "pointermove",
    function(e) {

        if (!drawing)
            return;

        e.preventDefault();

        if (
            selectionMode ===
            "outline"
        ) {

            const p =
                getPosition(e);

            outlinePoints.push(p);

            maskCtx.lineWidth =
                5;

            maskCtx.lineCap =
                "round";

            maskCtx.strokeStyle =
                "rgba(236,72,153,.85)";

            maskCtx.lineTo(
                p.x,
                p.y
            );

            maskCtx.stroke();

            maskCtx.beginPath();

            maskCtx.moveTo(
                p.x,
                p.y
            );

        } else {

            drawBrush(e);

        }

    }
);


/* =====================================================
POINTER END
===================================================== */

maskCanvas.addEventListener(
    "pointerup",
    function(e) {

        if (!drawing)
            return;

        drawing = false;

        if (
            selectionMode ===
            "outline"
        ) {

            finishOutline();

        }

    }
);


maskCanvas.addEventListener(
    "pointercancel",
    function() {

        drawing = false;

    }
);


/* =====================================================
BRUSH DRAW
===================================================== */

function drawBrush(e) {

    const p =
        getPosition(e);

    const size =
        Number(
            brushSize.value
        );

    maskCtx.fillStyle =
        "rgba(236,72,153,.65)";

    maskCtx.beginPath();

    maskCtx.arc(
        p.x,
        p.y,
        size / 2,
        0,
        Math.PI * 2
    );

    maskCtx.fill();

}


/* =====================================================
SMART OUTLINE
===================================================== */

function finishOutline() {

    if (
        outlinePoints.length <
        3
    ) {

        return;

    }

    // Close polygon
    const first =
        outlinePoints[0];

    maskCtx.lineTo(
        first.x,
        first.y
    );

    maskCtx.closePath();

    // Fill the inside
    maskCtx.fillStyle =
        "rgba(236,72,153,.35)";

    maskCtx.fill();

    // Strong visible border
    maskCtx.beginPath();

    maskCtx.moveTo(
        first.x,
        first.y
    );

    for (
        let i = 1;
        i < outlinePoints.length;
        i++
    ) {

        maskCtx.lineTo(
            outlinePoints[i].x,
            outlinePoints[i].y
        );

    }

    maskCtx.closePath();

    maskCtx.lineWidth =
        5;

    maskCtx.strokeStyle =
        "rgba(236,72,153,.9)";

    maskCtx.stroke();

    saveHistory();

}


/* =====================================================
HISTORY
===================================================== */

function saveHistory() {

    history.push(
        maskCtx.getImageData(
            0,
            0,
            maskCanvas.width,
            maskCanvas.height
        )
    );

    if (
        history.length >
        15
    ) {

        history.shift();

    }

}


/* =====================================================
UNDO
===================================================== */

function undoMask() {

    if (
        history.length ===
        0
    ) {

        clearMask();

        return;

    }

    const previous =
        history.pop();

    maskCtx.putImageData(
        previous,
        0,
        0
    );

}


/* =====================================================
CLEAR
===================================================== */

function clearMask() {

    maskCtx.clearRect(
        0,
        0,
        maskCanvas.width,
        maskCanvas.height
    );

    history = [];

    outlinePoints = [];

    resultImage.style.display =
        "none";

    downloadBtn.style.display =
        "none";

    document
        .getElementById(
            "resultPlaceholder"
        )
        .style.display =
        "block";

}


/* =====================================================
CREATE MASK
===================================================== */

function createMaskBlob() {

    return new Promise(
        function(resolve) {

            const mask =
                document.createElement(
                    "canvas"
                );

            mask.width =
                maskCanvas.width;

            mask.height =
                maskCanvas.height;

            const ctx =
                mask.getContext(
                    "2d"
                );

            ctx.fillStyle =
                "black";

            ctx.fillRect(
                0,
                0,
                mask.width,
                mask.height
            );

            const pixels =
                maskCtx.getImageData(
                    0,
                    0,
                    maskCanvas.width,
                    maskCanvas.height
                );

            const data =
                pixels.data;

            for (
                let i = 0;
                i < data.length;
                i += 4
            ) {

                if (
                    data[i + 3] >
                    10
                ) {

                    data[i] =
                        255;

                    data[i + 1] =
                        255;

                    data[i + 2] =
                        255;

                    data[i + 3] =
                        255;

                }

            }

            ctx.putImageData(
                pixels,
                0,
                0
            );

            mask.toBlob(
                function(blob) {

                    resolve(blob);

                },
                "image/png"
            );

        }
    );

}


/* =====================================================
PROCESS
===================================================== */

async function processImage() {

    if (!currentImage)
        return;

    loader.style.display =
        "flex";

    processBtn.disabled =
        true;

    if (
        selectedMethod ===
        "ai"
    ) {

        loaderText.innerText =
            "🤖 AI is rebuilding the background...";

    } else {

        loaderText.innerText =
            "⚡ Removing object...";

    }

    try {

        const imageBlob =
            await new Promise(
                resolve =>
                    imageCanvas.toBlob(
                        resolve,
                        "image/jpeg",
                        .97
                    )
            );

        const maskBlob =
            await createMaskBlob();

        const formData =
            new FormData();

        formData.append(
            "image",
            imageBlob,
            "image.jpg"
        );

        formData.append(
            "mask",
            maskBlob,
            "mask.png"
        );

        formData.append(
            "method",
            selectedMethod
        );

        formData.append(
            "selection_mode",
            selectionMode
        );

        const response =
            await fetch(
                "/process",
                {
                    method:
                        "POST",
                    body:
                        formData
                }
            );

        if (!response.ok) {

            let message =
                "Processing failed.";

            try {

                const data =
                    await response.json();

                message =
                    data.error ||
                    message;

                if (
                    data.details
                ) {

                    message +=
                        "\n" +
                        data.details;

                }

            } catch {}

            throw new Error(
                message
            );

        }

        const blob =
            await response.blob();

        const url =
            URL.createObjectURL(
                blob
            );

        resultImage.src =
            url;

        resultImage.style.display =
            "block";

        document
            .getElementById(
                "resultPlaceholder"
            )
            .style.display =
            "none";

        downloadBtn.href =
            url;

        downloadBtn.style.display =
            "block";

    } catch (error) {

        alert(
            error.message
        );

    } finally {

        loader.style.display =
            "none";

        processBtn.disabled =
            false;

    }

}

</script>

</body>

</html>
